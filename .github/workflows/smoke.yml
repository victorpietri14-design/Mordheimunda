name: Smoke tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MordheimundaActual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test only, not saved to package.json)
        run: npm install --no-save --no-audit --no-fund playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          sleep 2
      - name: Run smoke tests
        run: node tests/smoke.mjs http://localhost:8765
