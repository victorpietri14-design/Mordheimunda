name: Weekly database backup

# Every Monday early morning (UTC), and on demand from the Actions tab.
# The dump is ENCRYPTED before upload: this repository is public, and anyone
# signed in to GitHub can download a public repository's artifacts. Without
# both secrets the job stops and uploads nothing. See
# MordheimundaActual/server/db/BACKUP.md (setup and restore).
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add BACKUP_DATABASE_URL and BACKUP_PASSPHRASE in Settings > Secrets and variables > Actions (see MordheimundaActual/server/db/BACKUP.md)."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 16 characters long."
            exit 1
          fi

      - name: Dump the database
        run: |
          docker run --rm -e DATABASE_URL postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL"' > db.dump
          test -s db.dump
          echo "Dump size: $(du -h db.dump | cut -f1)"

      - name: Encrypt it (AES-256, passphrase from the secret)
        run: |
          out="mordheimunda-$(date -u +%F).dump.gpg"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "$out" db.dump
          shred -u db.dump 2>/dev/null || rm -f db.dump
          test -s "$out"

      - name: Upload the encrypted backup (kept 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: '*.dump.gpg'
          retention-days: 90
          if-no-files-found: error

      - name: Note the date in the site (Admin > Backup)
        run: |
          docker run --rm -e DATABASE_URL postgres:18 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -c \
            "INSERT INTO site_settings(key,value,updated_at) VALUES('lastAutoBackup',jsonb_build_object('at',NOW()),NOW()) ON CONFLICT(key) DO UPDATE SET value=EXCLUDED.value,updated_at=NOW()"
