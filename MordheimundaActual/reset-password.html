<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>Choose a new password // Mordheimunda</title>
<link rel="icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root{--ink:#e8d9b5;--dim:#c9b990;--muted:#7a6a4a;--brass:#c98a5a;--panel:#141210;--panel-2:#0b0908;--line:#3a2a1a;--good:#6a8a4a;--bad:#a24a3a}
 *,*::before,*::after{box-sizing:border-box}
 html,body{margin:0;padding:0;background:var(--panel-2);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100%}
 body{background:radial-gradient(ellipse at top,#1a120c 0%,#0b0908 60%) fixed;padding:32px 16px;display:flex;align-items:center;justify-content:center}
 main{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:36px 32px;box-shadow:0 24px 48px rgba(0,0,0,.55),inset 0 0 0 1px #1e150e;position:relative}
 main::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:3px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
 .brand{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;text-align:center;margin:0}
 .sub{font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center;margin:6px 0 30px 0}
 h1{font-family:'Cinzel',Georgia,serif;font-size:22px;letter-spacing:.09em;color:var(--ink);margin:0 0 10px 0;font-weight:700}
 p.lede{color:var(--dim);line-height:1.55;font-size:14px;margin:0 0 22px 0}
 label{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:14px 0 8px 0}
 input[type=password]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font-family:inherit;font-size:15px;border-radius:2px;outline:none;transition:border-color .18s,box-shadow .18s}
 input[type=password]:focus{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
 .rules{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.6}
 .rules span{display:block}
 .rules span.ok{color:var(--good)}
 .rules span::before{content:"○  ";color:var(--muted)}
 .rules span.ok::before{content:"●  ";color:var(--good)}
 button{width:100%;margin-top:22px;padding:13px 20px;background:linear-gradient(180deg,#4a2717,#2f1809);border:1px solid var(--brass);color:#f2e4c3;font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px;transition:transform .1s,background .18s,box-shadow .18s}
 button:hover:not(:disabled){background:linear-gradient(180deg,#5a2f1c,#3a1f10);box-shadow:0 0 0 1px var(--brass),0 6px 14px rgba(0,0,0,.35)}
 button:active:not(:disabled){transform:translateY(1px)}
 button:disabled{opacity:.55;cursor:not-allowed}
 .back{display:block;text-align:center;margin-top:22px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:color .18s}
 .back:hover{color:var(--brass)}
 .toast{margin-top:20px;padding:12px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--dim);font-size:13px;line-height:1.5;border-radius:2px;display:none}
 .toast.show{display:block;animation:fadeIn .3s ease-out}
 .toast.err{border-color:#5a2318;color:#e8b09a}
 .toast.ok{border-color:#3a5a1a;color:#c9e8a0}
 @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
 <p class="brand">Mordheimunda</p>
 <p class="sub">M17 Roster Manager</p>
 <h1 id="title">Choose a new password</h1>
 <p class="lede" id="lede">Enter a new password for your account. Once you save it, all other active sessions will be signed out.</p>
 <form id="form" novalidate>
  <label for="pw1">New password</label>
  <input id="pw1" type="password" required autocomplete="new-password" data-testid="new-password-input">
  <label for="pw2">Confirm password</label>
  <input id="pw2" type="password" required autocomplete="new-password" data-testid="confirm-password-input">
  <div class="rules" aria-live="polite">
   <span id="r-len" data-testid="rule-length">At least 8 characters</span>
   <span id="r-mix" data-testid="rule-mix">At least 1 letter and 1 digit</span>
   <span id="r-match" data-testid="rule-match">Both passwords match</span>
  </div>
  <button type="submit" id="submit" disabled data-testid="reset-submit-btn">Save new password</button>
 </form>
 <div id="toast" class="toast" role="status" aria-live="polite" data-testid="reset-toast"></div>
 <a class="back" href="/" data-testid="back-to-login-link">← Back to sign in</a>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search);
 const token=params.get('token')||'';
 const form=document.getElementById('form');
 const pw1=document.getElementById('pw1');
 const pw2=document.getElementById('pw2');
 const btn=document.getElementById('submit');
 const toast=document.getElementById('toast');
 const rLen=document.getElementById('r-len');
 const rMix=document.getElementById('r-mix');
 const rMatch=document.getElementById('r-match');
 function show(msg,cls){toast.textContent=msg;toast.className='toast show '+(cls||'');}
 // No token in the URL → the link was mangled or copied wrong. We say so
 // up front rather than letting the user type a new password only to have
 // the API reject it as INVALID_RESET after the fact.
 if(!token||token.length<20){
  document.getElementById('title').textContent='Link is invalid';
  document.getElementById('lede').textContent='This password-reset link is missing or malformed. Please request a new one.';
  form.style.display='none';
  const link=document.createElement('a');
  link.href='/forgot-password.html';link.className='back';link.textContent='Request a new link';
  link.setAttribute('data-testid','request-new-link');
  document.querySelector('main').appendChild(link);
  return;
 }
 function validate(){
  const a=pw1.value||'',b=pw2.value||'';
  const lenOk=a.length>=8&&a.length<=128;
  const mixOk=/[A-Za-z]/.test(a)&&/[0-9]/.test(a);
  const matchOk=!!a&&a===b;
  rLen.classList.toggle('ok',lenOk);
  rMix.classList.toggle('ok',mixOk);
  rMatch.classList.toggle('ok',matchOk);
  btn.disabled=!(lenOk&&mixOk&&matchOk);
 }
 pw1.addEventListener('input',validate);
 pw2.addEventListener('input',validate);
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(btn.disabled)return;
  btn.disabled=true;btn.textContent='Saving…';
  try{
   const r=await fetch('/api/auth/reset-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw1.value})});
   const body=await r.json().catch(()=>({}));
   if(r.ok){
    show('Password updated. Redirecting to sign in…','ok');
    setTimeout(()=>{location.href='/';},1600);
   }else if(body.error==='INVALID_RESET'){
    show('This link has expired or is no longer valid. Please request a new one.','err');
    btn.disabled=false;btn.textContent='Save new password';
   }else{
    show('Could not save your new password. Please try again.','err');
    btn.disabled=false;btn.textContent='Save new password';
   }
  }catch(err){show('Network error. Please try again in a moment.','err');btn.disabled=false;btn.textContent='Save new password';}
 });
})();
</script>
</body>
</html>
