<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>Reset your password // Mordheimunda</title>
<link rel="icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
 :root{--ink:#e8d9b5;--dim:#c9b990;--muted:#7a6a4a;--brass:#c98a5a;--blood:#7a2318;--panel:#141210;--panel-2:#0b0908;--line:#3a2a1a;--line-2:#2a1e14}
 *,*::before,*::after{box-sizing:border-box}
 html,body{margin:0;padding:0;background:var(--panel-2);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;min-height:100%}
 body{background:radial-gradient(ellipse at top,#1a120c 0%,#0b0908 60%) fixed;padding:32px 16px;display:flex;align-items:center;justify-content:center}
 main{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:36px 32px;box-shadow:0 24px 48px rgba(0,0,0,.55),inset 0 0 0 1px #1e150e;position:relative}
 main::before{content:"";position:absolute;top:-1px;left:-1px;right:-1px;height:3px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
 .brand{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.16em;color:var(--brass);text-transform:uppercase;text-align:center;margin:0}
 .sub{font-size:10px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;text-align:center;margin:6px 0 30px 0}
 h1{font-family:'Cinzel',Georgia,serif;font-size:22px;letter-spacing:.09em;color:var(--ink);margin:0 0 10px 0;font-weight:700}
 p.lede{color:var(--dim);line-height:1.55;font-size:14px;margin:0 0 22px 0}
 label{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;margin:0 0 8px 0}
 input[type=email]{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font-family:inherit;font-size:15px;border-radius:2px;outline:none;transition:border-color .18s,box-shadow .18s}
 input[type=email]:focus{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
 button{width:100%;margin-top:18px;padding:13px 20px;background:linear-gradient(180deg,#4a2717,#2f1809);border:1px solid var(--brass);color:#f2e4c3;font-family:'Cinzel',Georgia,serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;cursor:pointer;border-radius:2px;transition:transform .1s,background .18s,box-shadow .18s}
 button:hover:not(:disabled){background:linear-gradient(180deg,#5a2f1c,#3a1f10);box-shadow:0 0 0 1px var(--brass),0 6px 14px rgba(0,0,0,.35)}
 button:active:not(:disabled){transform:translateY(1px)}
 button:disabled{opacity:.55;cursor:wait}
 .back{display:block;text-align:center;margin-top:22px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:color .18s}
 .back:hover{color:var(--brass)}
 .toast{margin-top:20px;padding:12px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--dim);font-size:13px;line-height:1.5;border-radius:2px;display:none}
 .toast.show{display:block;animation:fadeIn .3s ease-out}
 .toast.err{border-color:#5a2318;color:#e8b09a}
 @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main>
 <p class="brand">Mordheimunda</p>
 <p class="sub">M17 Roster Manager</p>
 <h1>Reset your password</h1>
 <p class="lede">Enter the email address tied to your account. We'll send you a link to choose a new password. The link expires in 15 minutes.</p>
 <form id="form" novalidate>
  <label for="email">Email</label>
  <input id="email" type="email" required autocomplete="email" placeholder="warrior@mordheim.local" data-testid="forgot-email-input">
  <button type="submit" id="submit" data-testid="forgot-submit-btn">Send reset link</button>
 </form>
 <div id="toast" class="toast" role="status" aria-live="polite" data-testid="forgot-toast"></div>
 <a class="back" href="/" data-testid="back-to-login-link">← Back to sign in</a>
</main>
<script>
(function(){
 const form=document.getElementById('form');
 const email=document.getElementById('email');
 const btn=document.getElementById('submit');
 const toast=document.getElementById('toast');
 // Anti-enumeration: whether the account exists or not, we show the same
 // neutral message. Only network/parse failures ever surface as an error.
 const neutralMsg='If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder) in the next few minutes.';
 function show(msg,isErr){toast.textContent=msg;toast.className='toast show'+(isErr?' err':'');}
 form.addEventListener('submit',async e=>{
  e.preventDefault();
  const value=(email.value||'').trim();
  if(!value||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){show('Please enter a valid email address.',true);return;}
  btn.disabled=true;btn.textContent='Sending…';
  try{
   const r=await fetch('/api/auth/forgot-password',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:value})});
   if(r.status===429){show('Too many attempts. Please wait an hour before trying again.',true);}
   else{show(neutralMsg,false);form.reset();}
  }catch(err){show('Network error. Please try again in a moment.',true);}
  finally{btn.disabled=false;btn.textContent='Send reset link';}
 });
})();
</script>
</body>
</html>
