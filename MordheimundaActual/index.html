<script>if('serviceWorker' in navigator){
  let swRefreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    // A newly deployed service worker just took control: reload once so the
    // page (and every asset it references) reflects the new version, with no
    // manual hard-refresh needed — including on mobile.
    if(swRefreshing)return; swRefreshing=true; location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then(reg=>{
      // Also poll for updates while the app stays open in a tab/background.
      setInterval(()=>reg.update().catch(()=>{}),60*1000);
    }).catch(()=>{});
  });
}</script>
